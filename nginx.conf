# Existing h3t.dev config
server {
    listen 80;
    server_name h3t.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name h3t.dev;
    ssl_certificate /etc/ssl/certs/h3t.dev.crt;
    ssl_certificate_key /etc/ssl/private/h3t.dev.key;
    ssl_trusted_certificate /etc/ssl/certs/ca-bundle.crt;
    
    location / {
        proxy_pass http://planka:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# NEW: yt.h3t.dev for YouTube Translator
server {
    listen 80;
    server_name yt.h3t.dev;
    
    # Certbot sẽ tự động thêm redirect 301 ở đây sau khi chạy
    # hoặc bạn có thể thêm tạm:
    return 301 https://$server_name$request_uri;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name yt.h3t.dev;
    
    # SSL certificates (sẽ được Certbot tạo)
    ssl_certificate /etc/letsencrypt/live/yt.h3t.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.h3t.dev/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Tăng max body size cho upload video (nếu cần)
    client_max_body_size 500M;
    
    # Proxy to Docker container
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout cao cho video processing
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }
    
    # Static files (output videos)
    location /output {
        proxy_pass http://localhost:8000/output;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Cache cho video files
        proxy_cache_valid 200 1h;
        proxy_buffering on;
    }
}